[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-identity-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
  "gunicorn==23.0.0"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
